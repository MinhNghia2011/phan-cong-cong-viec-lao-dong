<style>

.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}

.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:12px}

ul{list-style:none;margin:0;padding:0}

li:first-child{border-top:0}
li .name{flex:1;overflow-wrap:anywhere}
li.off .name{color:var(--muted);text-decoration:line-through}
.x{border:0;background:none;color:var(--danger);padding:4px 8px}
.lock{border:0;background:none;color:var(--muted);font-size:13px;padding:4px 0;text-decoration:underline}
.chk{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:13px}
.empty{color:var(--muted);margin:0}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:16px}
.status{color:var(--muted);font-size:13px}
.list li{padding:14px 0}
.list .task{flex:1;font-weight:500}
.list .who{font-weight:700;font-size:17px;background:var(--now);border:1px solid var(--now-line);border-radius:999px;padding:4px 14px}
.next{color:var(--muted);font-size:13px;margin:12px 0 0}
.groups li{display:block}
.groups b{display:block}
.groups span{color:var(--muted);font-size:14px}
</style>
</head>

off":false},{"id":"rjixnop","name":"HUỲNH TRUNG NHẬT","g":"6byd2fp","off":false},{"id":"0frnx4w","name":"PHẠM TRẦN CHẤN PHONG","g":"0vp9lvy","off":false},{"id":"ku3ltjv","name":"PHẠM MINH PHƯƠNG","g":"co7tarb","off":false},{"id":"wdnvsqx","name":"PHẠM THẾ SANG","g":"6byd2fp","off":false},{"id":"fh3rhcf","name":"LÊ NGUYỄN HOÀNG SƠN","g":"lw2ucia","off":false},{"id":"tulbf05","name":"NGUYỄN THÀNH TÀI","g":"2fdj28l","off":false},{"id":"4pjn1d7","name":"PHẠM NGUYỄN ANH TÀI","g":"nlnx5r1","off":false},{"id":"0ern6ma","name":"HÀ THỊ PHƯƠNG TRANG","g":"lw2ucia","off":false},{"id":"t1txjxj","name":"LÊ BẢO TRÂN","g":"nlnx5r1","off":false},{"id":"t4kweb8","name":"PHAN NGUYỄN THẠCH TÙNG","g":"2fdj28l","off":false},{"id":"ptxvr8b","name":"LÊ THẢO UYÊN","g":"co7tarb","off":false}],"tasks":[{"id":"j0namuo","name":"Quét cầu thang (hết tới khối 11)"},{"id":"w0g9tba","name":"Quét lớp (đầu giờ + ra về)"},{"id":"yhqe8xo","name":"Lau bảng + giặt khăn + gom rác trong học bàn + đổ rác (đầu giờ + ra về)"},{"id":"bl4aein","name":"Quét sảnh"}],"assign":{"j0namuo":"kx76m8o","w0g9tba":"nv49ic4","yhqe8xo":"t1txjxj","bl4aein":"4pjn1d7"},"done":["m0","m1","m2","21om10a","3oq0wff","3yopafp","wi6eiaf","r7zf3up","ku3ltjv","5448cw3","ptxvr8b","tqbkg7n","vqufttq","hfbmcox","p6xf9tw","l12bgtj","eov0ey5","tulbf05","t4kweb8","lorwmt4","0ern6ma","fh3rhcf","c0a9mzq","1g5gfs7","wdnvsqx","rjixnop","w50qybh","2mpy2io","p0lqese","0frnx4w","we6w158","urg7efi","4pjn1d7","t1txjxj","kx76m8o","nv49ic4"],"updated":"2026-11-06T12:42:32.044Z","hour":17,"skip":[0,6],"holidays":["2026-11-09","2026-11-10","2026-11-11","2026-11-12"],"lastDay":"2026-11-06","carry":false}</script>
<script>
const PASS="1";
const S=JSON.parse(document.getElementById("data").textContent);
let editor=false,dirty=false,note="",addG=S.groups[0].id;
const $app=document.getElementById("app");
let rnd=Math.random;
const uid=()=>Math.random().toString(36).slice(2,9);
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const grp=()=>S.groups[S.gi]||S.groups[0];
const gact=id=>S.members.filter(m=>m.g===id&&!m.off);
const nameOf=id=>(S.members.find(m=>m.id===id)||{}).name;
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

// Chọn ngẫu nhiên người trong nhóm hiện tại, ưu tiên người chưa làm trong chu kỳ của nhóm
function genAssign(){
  const a=gact(grp().id);if(!a.length||!S.tasks.length){S.assign={};return}
  const ids=new Set(a.map(m=>m.id));
  const other=S.done.filter(id=>!ids.has(id));
  let done=S.done.filter(id=>ids.has(id));
  const pick=[];
  while(pick.length<S.tasks.length){
    let left=shuffle(a.filter(m=>!done.includes(m.id)&&!pick.includes(m)));
    if(!left.length){if(done.length){done=[];continue}left=shuffle(a.slice())}
    for(const m of left){if(pick.length>=S.tasks.length)break;pick.push(m);done.push(m.id)}
  }
  const as={};S.tasks.forEach((t,i)=>as[t.id]=pick[i].id);
  S.assign=as;S.done=other.concat(done);
}
function nextIndex(){const n=S.groups.length;for(let k=1;k<=n;k++){const i=(S.gi+k)%n;if(gact(S.groups[i].id).length)return i}return S.gi}
function newRound(){S.round++;S.gi=nextIndex();genAssign()}
function fix(){
  const a=gact(grp().id),ids=new Set(a.map(m=>m.id));
  if(!a.length){S.assign={};return}
  const load={};a.forEach(m=>load[m.id]=0);
  S.tasks.forEach(t=>{if(ids.has(S.assign[t.id]))load[S.assign[t.id]]++});
  S.tasks.forEach(t=>{if(ids.has(S.assign[t.id]))return;
    const min=Math.min(...a.map(m=>load[m.id])),c=a.filter(m=>load[m.id]===min);
    const p=c[Math.floor(rnd()*c.length)];S.assign[t.id]=p.id;load[p.id]++});
}
function change(fn){fn();fix();dirty=true;note="";render()}
function gsel(val,on){const s=document.createElement("select");s.setAttribute("aria-label","Nhóm");
  S.groups.forEach(g=>{const o=el("option","",g.name);o.value=g.id;if(g.id===val)o.selected=true;s.append(o)});
  s.onchange=()=>on(s.value);return s}


// ===== Tự động đổi lượt (giờ Việt Nam, UTC+7) =====
// Mọi người mở trang đều tính ra cùng một kết quả nhờ số ngẫu nhiên theo seed (ngày + số lượt).
const DAY=864e5;
const vn=()=>new Date(Date.now()+7*36e5);
const ymd=d=>d.toISOString().slice(0,10);
const toDate=s=>new Date(s+"T00:00:00Z");
function seeded(str){
  let h=1779033703^str.length;
  for(let i=0;i<str.length;i++){h=Math.imul(h^str.charCodeAt(i),3432918353);h=h<<13|h>>>19}
  let a=h>>>0;
  return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
}
function autoAdvance(){
  const n=vn(),today=ymd(n),hr=n.getUTCHours(),end=toDate(today);
  let last=toDate(S.lastDay),ticks=0;
  if(end-last>400*DAY)last=new Date(+end-400*DAY);
  for(let d=new Date(+last+DAY);d<=end;d=new Date(+d+DAY)){
    const s=ymd(d);
    if(s===today&&hr<S.hour)break;
    S.lastDay=s;
    if(S.skip.includes(d.getUTCDay()))continue;
    const hol=S.holidays.includes(s);
    if(S.carry){if(!hol)S.carry=false;continue}
    rnd=seeded(s+"|"+S.round);newRound();rnd=Math.random;ticks++;
    S.updated=s+"T"+String(S.hour).padStart(2,"0")+":00:00+07:00";
    if(hol)S.carry=true;
  }
  return ticks;
}
function nextAuto(){
  const today=ymd(vn());let c=S.carry;
  for(let i=0;i<400;i++){
    const d=new Date(+toDate(today)+i*DAY),s=ymd(d);
    if(s<=S.lastDay||S.skip.includes(d.getUTCDay()))continue;
    const hol=S.holidays.includes(s);
    if(c){if(!hol)c=false;continue}
    return s;
  }
  return null;
}
const fmtDay=s=>toDate(s).toLocaleDateString("vi-VN",{weekday:"long",day:"numeric",month:"numeric",timeZone:"UTC"});
const fmtFull=s=>toDate(s).toLocaleDateString("vi-VN",{day:"2-digit",month:"2-digit",year:"numeric",timeZone:"UTC"});
function holRanges(){const rs=[];
  S.holidays.forEach(h=>{const r=rs[rs.length-1];
    if(r&&ymd(new Date(+toDate(r.to)+DAY))===h)r.to=h;else rs.push({from:h,to:h})});
  return rs}
const fmtRange=r=>r.from===r.to?fmtFull(r.from):"Từ "+fmtFull(r.from)+" đến "+fmtFull(r.to);
function planDay(){let d=new Date(+toDate(S.lastDay)+DAY);
  for(let i=0;i<400;i++){const x=ymd(d);if(!S.skip.includes(d.getUTCDay())&&!S.holidays.includes(x))return x;d=new Date(+d+DAY)}return null}
S.hour??=7;S.skip??=[0,6];S.holidays??=[];S.carry??=false;S.lastDay??=ymd(vn());

function render(){
  $app.replaceChildren();
  document.getElementById("sub").textContent=editor
    ?"Bạn đang ở chế độ chỉnh sửa. Sau khi sửa, tải file mới và đưa lên website để người xem thấy."
    :"Phân công trực nhật cho ngày tiếp theo, người phụ trách được chọn ngẫu nhiên trong nhóm.";
  const g=grp(),a=gact(g.id);
  if(editor){
    const bar=el("div","bar");
    const nb=el("button","","Sang lượt mới");nb.onclick=()=>change(()=>{newRound();S.lastDay=ymd(vn())});
    const sb=el("button","primary","Tải file đã cập nhật");sb.disabled=!dirty;sb.onclick=save;
    const doneN=S.done.filter(id=>a.some(m=>m.id===id)).length;
    bar.append(nb,sb,el("span","status",note||(dirty?"Có thay đổi chưa xuất ra file. ":"")+g.name+": "+doneN+"/"+a.length+" người đã làm trong chu kỳ"));
    $app.append(bar);
  }
  const p=el("section","panel");
  const pd=planDay();
  if(pd){const lb=el("p","next","Phân công ngày "+fmtDay(pd));lb.style.margin="0 0 4px";p.append(lb)}
  p.append(el("h2","",g.name));
  const ul=el("ul","list");
  if(!S.tasks.length||!a.length)ul.append(el("li","empty","Chưa có phân công nào."));
  else S.tasks.forEach(t=>{const li=el("li");li.append(el("span","task",t.name),el("span","who",nameOf(S.assign[t.id])||"—"));ul.append(li)});
  p.append(ul);
  if(S.groups.length>1)p.append(el("p","next","Hôm sau: "+S.groups[nextIndex()].name));
  if(editor){const na=nextAuto();
  p.append(el("p","next",(S.carry?"Đang hoãn: lượt này được giữ thêm một ngày làm việc. ":"")+(na?"Tự động đổi lượt: "+fmtDay(na)+" lúc "+S.hour+":00":"Chưa có lịch đổi lượt tự động")))}
  $app.append(p);

  const today0=ymd(vn()),upH=holRanges().filter(r=>r.to>=today0);
  if(upH.length){
    const ph=el("section","panel");ph.append(el("h2","","Lịch nghỉ"));
    const hu=el("ul");
    upH.forEach(r=>{const li=el("li");li.append(el("span","name",fmtRange(r)));
      if(r.from<=today0)li.append(el("span","who","Đang nghỉ"));
      hu.append(li)});
    ph.append(hu);
    $app.append(ph);
  }

  const pg=el("section","panel groups");pg.append(el("h2","","Các nhóm"));
  const gl=el("ul");
  S.groups.forEach(x=>{const li=el("li");li.append(el("b","",x.name),el("span","",S.members.filter(m=>m.g===x.id).map(m=>m.name+(m.off?" (vắng)":"")).join(", ")||"Chưa có thành viên"));gl.append(li)});
  pg.append(gl);$app.append(pg);

  if(!editor){const f=el("button","lock","Chỉnh sửa");f.onclick=()=>{const v=prompt("Nhập mật khẩu");if(v===PASS){editor=true;render()}else if(v!==null)alert("Sai mật khẩu")};$app.append(f);return}
  pg.remove();
  const cols=el("div","cols");

  const pn=el("section","panel");pn.append(el("h2","","Nhóm"));
  const fg=el("form","row"),ig=el("input");ig.type="text";ig.placeholder="Tên nhóm";ig.setAttribute("aria-label","Tên nhóm");
  fg.append(ig,el("button","primary","Thêm"));
  fg.onsubmit=e=>{e.preventDefault();const v=ig.value.trim();if(v)change(()=>S.groups.push({id:uid(),name:v}))};
  pn.append(fg);const gu=el("ul");
  S.groups.forEach((x,i)=>{const li=el("li");li.append(el("span","name",x.name+" ("+S.members.filter(m=>m.g===x.id).length+")"));
    if(S.groups.length>1){const d=el("button","x","Xóa");d.onclick=()=>change(()=>{
      const rest=S.groups.filter(k=>k!==x);S.members.forEach(m=>{if(m.g===x.id)m.g=rest[0].id});
      const was=grp()===x;S.groups=rest;S.gi=Math.min(S.gi,rest.length-1);if(was)genAssign()});li.append(d)}
    gu.append(li)});
  pn.append(gu);

  const pt=el("section","panel");pt.append(el("h2","","Công việc"));
  const ft=el("form","row"),it=el("input");it.type="text";it.placeholder="Tên công việc";it.setAttribute("aria-label","Tên công việc");
  ft.append(it,el("button","primary","Thêm"));
  ft.onsubmit=e=>{e.preventDefault();const v=it.value.trim();if(v)change(()=>S.tasks.push({id:uid(),name:v}))};
  pt.append(ft);const tl=el("ul");
  if(!S.tasks.length)tl.append(el("li","empty","Chưa có công việc nào."));
  S.tasks.forEach(t=>{const li=el("li");li.append(el("span","name",t.name));
    const x=el("button","x","Xóa");x.onclick=()=>change(()=>{S.tasks=S.tasks.filter(k=>k!==t);delete S.assign[t.id]});
    li.append(x);tl.append(li)});
  pt.append(tl);

  const pm=el("section","panel wide");pm.append(el("h2","","Thành viên"));
  const fm=el("form","row"),im=el("input");im.type="text";im.placeholder="Tên thành viên";im.setAttribute("aria-label","Tên thành viên");
  fm.append(im,gsel(addG,v=>{addG=v}),el("button","primary","Thêm"));
  fm.onsubmit=e=>{e.preventDefault();const v=im.value.trim();if(v)change(()=>S.members.push({id:uid(),name:v,g:addG,off:false}))};
  pm.append(fm);const ml=el("ul");
  if(!S.members.length)ml.append(el("li","empty","Chưa có thành viên nào."));
  S.members.forEach(m=>{const li=el("li",m.off?"off":"");li.append(el("span","name",m.name));
    li.append(gsel(m.g,v=>change(()=>{m.g=v})));
    const lb=el("label","chk"),cb=document.createElement("input");cb.type="checkbox";cb.checked=m.off;
    cb.onchange=()=>change(()=>{m.off=cb.checked});lb.append(cb,"Vắng");
    const x=el("button","x","Xóa");x.onclick=()=>change(()=>{S.members=S.members.filter(k=>k!==m)});
    li.append(lb,x);ml.append(li)});
  pm.append(ml);

  const ps=el("section","panel wide");ps.append(el("h2","","Lịch tự động"));
  const r1=el("div","row"),hs=document.createElement("select");hs.setAttribute("aria-label","Giờ đổi lượt");
  for(let h=0;h<24;h++){const o=el("option","",h+":00");o.value=h;if(h===S.hour)o.selected=true;hs.append(o)}
  hs.onchange=()=>change(()=>{S.hour=+hs.value});
  r1.append(el("span","","Đổi lượt mỗi ngày lúc"),hs);ps.append(r1);
  const r2=el("div","row");r2.append(el("span","","Không đổi lượt vào:"));
  [[1,"T2"],[2,"T3"],[3,"T4"],[4,"T5"],[5,"T6"],[6,"T7"],[0,"CN"]].forEach(([v,t])=>{
    const lb=el("label","chk"),cb=document.createElement("input");cb.type="checkbox";cb.checked=S.skip.includes(v);
    cb.onchange=()=>change(()=>{S.skip=S.skip.filter(x=>x!==v);if(cb.checked)S.skip.push(v)});
    lb.append(cb,t);r2.append(lb)});
  ps.append(r2);
  ps.append(el("h2","","Ngày nghỉ lễ (công việc dời sang ngày làm việc kế tiếp)"));
  const fh=el("form","row"),i1=el("input"),i2=el("input");
  i1.type="date";i1.setAttribute("aria-label","Nghỉ từ ngày");
  i2.type="date";i2.setAttribute("aria-label","Nghỉ đến ngày");
  i1.onchange=()=>{if(i1.value&&(!i2.value||i2.value<i1.value))i2.value=i1.value};
  fh.append(el("span","","Nghỉ từ"),i1,el("span","","đến"),i2,el("button","primary","Thêm kỳ nghỉ"));
  fh.onsubmit=e=>{e.preventDefault();
    let a=i1.value,b=i2.value||a;if(!a)return;if(b<a)[a,b]=[b,a];
    change(()=>{
      const set=new Set(S.holidays);
      for(let d=toDate(a);ymd(d)<=b;d=new Date(+d+DAY))set.add(ymd(d));
      S.holidays=[...set].sort();
    })};
  ps.append(fh);
  const hl=el("ul");
  if(!S.holidays.length)hl.append(el("li","empty","Chưa có ngày nghỉ lễ nào."));
  const ranges=holRanges();
  ranges.forEach(r=>{const li=el("li");
    li.append(el("span","name",fmtRange(r)));
    const x=el("button","x","Xóa");
    x.onclick=()=>change(()=>{S.holidays=S.holidays.filter(k=>k<r.from||k>r.to)});
    li.append(x);hl.append(li)});
  ps.append(hl);
  const pb=el("button","",S.carry?"Hủy hoãn":"Hoãn lượt này sang ngày làm việc kế tiếp");
  pb.onclick=()=>change(()=>{S.carry=!S.carry});
  const wr=el("div","row");wr.style.marginTop="12px";wr.append(pb);ps.append(wr);
  ps.append(el("p","hint","Dùng nút hoãn khi phát sinh nghỉ đột xuất: lần đổi lượt kế tiếp sẽ bị bỏ qua một lần."));
  cols.append(pn,pt,ps,pm);$app.append(cols);
}

function save(){
  S.updated=new Date().toISOString();
  const c=document.documentElement.cloneNode(true);
  c.querySelector("#data").textContent=JSON.stringify(S).replace(/</g,"\\u003c");
  c.querySelector("#app").replaceChildren();
  const blob=new Blob(["<!DOCTYPE html>\n"+c.outerHTML],{type:"text/html"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="phan-cong.html";document.body.append(a);a.click();a.remove();
  dirty=false;note="Đã tải file mới. Hãy tải file này lên website thay cho file cũ.";render();
}
autoAdvance();
render();
</script>
