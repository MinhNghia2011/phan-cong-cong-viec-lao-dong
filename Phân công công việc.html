<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Phân công công việc</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f6fa;--surface:#fff;--ink:#14213d;--muted:#5b6b85;--line:#d9e1ec;--accent:#2f5bea;--accent-ink:#fff;--now:#fff1cc;--now-line:#e0a526;--danger:#c0392b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1624;--surface:#17213a;--ink:#e8eefb;--muted:#9aa9c4;--line:#2a3757;--accent:#6f93ff;--accent-ink:#0f1624;--now:#3a3016;--danger:#ff7b6b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1624;--surface:#17213a;--ink:#e8eefb;--muted:#9aa9c4;--line:#2a3757;--accent:#6f93ff;--accent-ink:#0f1624;--now:#3a3016;--danger:#ff7b6b;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 "Be Vietnam Pro",system-ui,sans-serif}
main{max-width:860px;margin:0 auto;padding:24px 16px 48px}
h1{font-size:28px;font-weight:800;margin:0 0 4px;letter-spacing:-.01em}
h2{font-size:16px;font-weight:700;margin:0 0 12px}
.sub{color:var(--muted);margin:0 0 20px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
@media(max-width:700px){.cols{grid-template-columns:1fr}}
.cols .panel{margin:0}
.row{display:flex;gap:8px;margin-bottom:12px}
input[type=text]{flex:1;font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px;min-width:0}
button{font:inherit;font-weight:500;cursor:pointer;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 14px}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button:disabled{opacity:.5;cursor:default}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
ul{list-style:none;margin:0;padding:0}
li{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
li:first-child{border-top:0}
li .name{flex:1;overflow-wrap:anywhere}
li.off .name{color:var(--muted);text-decoration:line-through}
.x{border:0;background:none;color:var(--danger);padding:4px 8px}
.chk{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:13px}
.empty{color:var(--muted);margin:0}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:16px}
.status{color:var(--muted);font-size:13px}
.list li{padding:14px 0}
.list .task{flex:1;font-weight:500}
.list .who{font-weight:700;font-size:17px;background:var(--now);border:1px solid var(--now-line);border-radius:999px;padding:4px 14px}
</style>
</head>
<body>
<main>
<h1>Phân công công việc</h1>
<p class="sub" id="sub"></p>
<div id="app"></div>
</main>
<script type="application/json" id="data">{"round":1,"members":[{"id":"m0","name":"An","off":false},{"id":"m1","name":"Bình","off":false},{"id":"m2","name":"Chi","off":false}],"tasks":[{"id":"t0","name":"Rửa chén"},{"id":"t1","name":"Đổ rác"},{"id":"t2","name":"Lau nhà"}],"assign":{"t0":"m1","t1":"m2","t2":"m0"},"updated":""}</script>
<script>
const S=JSON.parse(document.getElementById("data").textContent);
let editor=false,dirty=false,note="";
const $app=document.getElementById("app");
const uid=()=>Math.random().toString(36).slice(2,9);
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const active=()=>S.members.filter(m=>!m.off);
const nameOf=id=>(S.members.find(m=>m.id===id)||{}).name;
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function newRound(){
  const a=active();if(!a.length||!S.tasks.length){S.assign={};return}
  const prev=S.assign||{};let best;
  for(let k=0;k<40;k++){
    const sh=shuffle(a.slice()),as={};S.tasks.forEach((t,i)=>as[t.id]=sh[i%sh.length].id);best=as;
    if(a.length<2||S.tasks.every(t=>prev[t.id]!==as[t.id]))break}
  S.assign=best;
}
function fix(){
  const a=active(),ids=new Set(a.map(m=>m.id));if(!a.length){S.assign={};return}
  S.assign=S.assign||{};
  const load={};a.forEach(m=>load[m.id]=0);
  S.tasks.forEach(t=>{if(ids.has(S.assign[t.id]))load[S.assign[t.id]]++});
  S.tasks.forEach(t=>{if(ids.has(S.assign[t.id]))return;
    const min=Math.min(...a.map(m=>load[m.id])),c=a.filter(m=>load[m.id]===min);
    const p=c[Math.floor(Math.random()*c.length)];S.assign[t.id]=p.id;load[p.id]++});
}
function change(fn){fn();fix();dirty=true;note="";render()}

function render(){
  $app.replaceChildren();
  document.getElementById("sub").textContent=editor
    ?"Bạn đang ở chế độ chỉnh sửa. Người xem chỉ thấy công việc và người phụ trách."
    :"Người phụ trách từng công việc ở lượt hiện tại.";
  if(editor){
    const bar=el("div","bar");
    const nb=el("button","","Xáo ngẫu nhiên lượt mới");nb.onclick=()=>change(()=>{S.round++;newRound()});
    const sb=el("button","primary","Lưu và đăng");sb.disabled=!dirty;sb.onclick=save;
    bar.append(nb,sb,el("span","status",note||(dirty?"Có thay đổi chưa đăng.":"Đã đăng.")));
    $app.append(bar);
  }
  const p=el("section","panel");
  p.append(el("h2","","Lượt "+S.round+(S.updated?" · cập nhật "+new Date(S.updated).toLocaleDateString("vi-VN"):"")));
  const ul=el("ul","list");
  if(!S.tasks.length||!active().length)ul.append(el("li","empty","Chưa có phân công nào."));
  else S.tasks.forEach(t=>{const li=el("li");li.append(el("span","task",t.name),el("span","who",nameOf(S.assign[t.id])||"—"));ul.append(li)});
  p.append(ul);$app.append(p);
  if(!editor)return;

  const cols=el("div","cols");
  const pm=el("section","panel");pm.append(el("h2","","Thành viên"));
  const fm=el("form","row"),im=el("input");im.type="text";im.placeholder="Tên thành viên";im.setAttribute("aria-label","Tên thành viên");
  const bm=el("button","primary","Thêm");fm.append(im,bm);
  fm.onsubmit=e=>{e.preventDefault();const v=im.value.trim();if(v)change(()=>S.members.push({id:uid(),name:v,off:false}))};
  pm.append(fm);const ml=el("ul");
  if(!S.members.length)ml.append(el("li","empty","Chưa có thành viên nào."));
  S.members.forEach(m=>{const li=el("li",m.off?"off":"");li.append(el("span","name",m.name));
    const lb=el("label","chk"),cb=document.createElement("input");cb.type="checkbox";cb.checked=m.off;
    cb.onchange=()=>change(()=>{m.off=cb.checked});lb.append(cb,"Vắng");
    const x=el("button","x","Xóa");x.onclick=()=>change(()=>{S.members=S.members.filter(k=>k!==m)});
    li.append(lb,x);ml.append(li)});
  pm.append(ml);

  const pt=el("section","panel");pt.append(el("h2","","Công việc"));
  const ft=el("form","row"),it=el("input");it.type="text";it.placeholder="Tên công việc";it.setAttribute("aria-label","Tên công việc");
  ft.append(it,el("button","primary","Thêm"));
  ft.onsubmit=e=>{e.preventDefault();const v=it.value.trim();if(v)change(()=>S.tasks.push({id:uid(),name:v}))};
  pt.append(ft);const tl=el("ul");
  if(!S.tasks.length)tl.append(el("li","empty","Chưa có công việc nào."));
  S.tasks.forEach(t=>{const li=el("li");li.append(el("span","name",t.name));
    const x=el("button","x","Xóa");x.onclick=()=>change(()=>{S.tasks=S.tasks.filter(k=>k!==t);delete S.assign[t.id]});
    li.append(x);tl.append(li)});
  pt.append(tl);cols.append(pm,pt);$app.append(cols);
}

async function save(){
  const art=await claude.use("artifact");
  if(!art){note="Không thể lưu ở đây.";render();return}
  S.updated=new Date().toISOString();
  const c=document.documentElement.cloneNode(true);
  c.querySelector("#data").textContent=JSON.stringify(S).replace(/</g,"\\u003c");
  c.querySelector("#app").replaceChildren();
  try{await art.publish("<!DOCTYPE html>\n"+c.outerHTML)}
  catch(e){note=e&&e.code==="conflict"?"Trang vừa được cập nhật ở nơi khác, hãy tải lại.":"Chưa lưu được, thử lại.";render()}
}

render();
(async()=>{try{const u=await claude.use("user");if(u&&u.isOwner()){editor=true;render()}}catch(e){}})();
</script>
</body>
</html>
